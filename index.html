<body>

    <h2>The <i>Nickname</i> Atlas of Southeast Asia</h2>

        <div id="output">
            <form>
            <label for="ctry" style="font-weight:bold" id="ctry">Select a Southeast Asian Country</label><br>
            <br>
                <select id="sea" class="form-control">
                    <option value="The Pearl of the  Orient Sea">Philippines</option>
                    <option value="The Lion City/Sky Garden">Singapore</option>
                    <option value="The Land of the Rising Sun">Japan</option>
                    <option value="The Land of Smiles/Land of the White Elephant">Thailand</option>
                    <option value="The Land of the Blue Dragon/Land of the Ascending Dragon">Vietnam</option>
                    <option value="The Emerald of the Equator/Land of a Thousand Islands">Indonesia</option>
                    <option value="Land of Unexpected Treasures">Brunei</option>
                    <option value="Kingdom of Wonder">Cambodia</option>
                </select>


             <div id="present"></div>
        
            <hr>
            <button type="button" py-click="reveal_name">Reveal Nickname</button><br>
    

        </div>


    <footer class="text-center py-3 bg-dark text-light mt-auto fixed-bottom">
	Seatwork 1 - 2nd Quarter SW1: Nickname Atlas of Southeast Asian Countries by Jaena B. Ambata
